  source_excerpt: '<p>Calibre is a unified ebook management platform that allows users
    to integrate their ebook libraries, convert ebook files between formats, and transfer
    ebooks to various devices. It&#8217;s also handy for reading .epub or .mobi files
    on a PC or Mac without many of the annoying restrictions one encounters on readers
    from Adobe, Google, or Amazon. Calibre can also be configured to remove pesky
    DRM from purchased ebooks, although this accessing this functionality requires
    some tweaking. In any case, Calibre is the perfect organizational tool for those
    (like me) who use digital books in their research.</p>

    <p>Alternatives: None (Calibre is in a class of its own)</p>

    <p><a href="http://freemind.sourceforge.net/wiki/index.php/Main_Page">FreeMind</a></p>

    <p>There are many apps designed for &#8220;mind mapping,&#8221; which is essentially
    a fancy term for graphics-based outlining. FreeMind is a lightweight mind mapping
    utility that allows users to sketch ideas visually using a simple interface. It
    also allows easy exportation of mind maps to other formats, such as PDF and HTML.
    Great for outlining papers or getting down nascent thoughts before they slip away.</p>

    <p>Alternatives: <a href="https://coggle.it/">Coggle</a>, <a href="http://www.xmind.net/">XMind</a>.</p>'
