  source_excerpt: '<p><a href="https://www.zotero.org/">Zotero</a> Citation Manager</p>

    <p>Zotero is a citation manager that allows scholars to organize research, create
    bibliographies, and maintain a personal library. Zotero started out as a Firefox
    extension, and one of its most impressive features is still its ability to pull
    full articles and citations from popular databases with one click. The application
    maintains lists of books and articles that can be readily converted into bibliographies
    in MLA, APA, or any major citation format. Rival citation manager <a href="http://www.refworks.com/">RefWorks</a>
    is also worth a look.</p>

    <p>Alternatives: <a href="http://www.refworks.com/">RefWorks</a>, <a href="https://endnote.com/">Endnote</a>.
    <a href="https://www.easybib.com/">EasyBib</a> for dilitantes or the half-hearted.</p>

    <p><a href="https://calibre-ebook.com/">Calibre</a></p>

    <p>Calibre is a unified ebook management platform that allows users to integrate
    their ebook libraries, convert ebook files between formats, and transfer ebooks
    to various devices. It&#8217;s also handy for reading .epub or .mobi files on
    a PC or Mac without many of the annoying restrictions one encounters on readers
    from Adobe, Google, or Amazon. Calibre can also be configured to remove pesky
    DRM from purchased ebooks, although this accessing this functionality requires
    some tweaking. In any case, Calibre is the perfect organizational tool for those
    (like me) who use digital books in their research.</p>'
