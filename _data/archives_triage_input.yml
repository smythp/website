  source_excerpt: '<p>Yet there is some hope for those who wish to continue using
    e-books for writing and research. Here are two workarounds for quoting digital
    editions:</p>

    <p><b>Google Books Wordaround</b></p>

    <p>This method involves taking the quote you&#8217;ve found in an e-book and tracking
    down the corresponding print location using the search function in Google Books.
    First, navigate to <a href="https://books.google.com/">Google Books</a> and enter
    the name of the book you wish to quote. Pick a print edition of the book from
    the resulting list, if available. Next, copy a snippet of the text you wish to
    quote and paste it into the small search field on the left side of the book description.
    This should bring up the page in the print edition that corresponds to your quote,
    and you can then use that page number in an in-text citation. Finally, construct
    a bibliography entry based on the print edition of the book rather than the digital
    edition.</p>

    <p>The advantage of this method is that it results in a precise page number and
    a standard MLA print citation. However, it also adds an extra step in the citation
    process and it works only for the books that have been digitized by Google. Some
    scholars also find this process a bit disingenuous. Their reasoning is that if
    you use an e-book in your research, your bibliography should reflect that, and
    that switching between the forms can introduce discrepancies. However, my feeling
    is that Google Books allows one to check for differences between print and e-book
    editions before including a quote in your writing.</p>

    <p><b>Kindle Position</b></p>'
