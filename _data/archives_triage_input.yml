  source_excerpt: "\t<p>Most scholars in the humanities avoid using e-books for research.\
    \ The difficulty is mostly citation—one immediately runs into problems when quoting\
    \ digital editions, and the solutions proposed by MLA and other major arbiters\
    \ of style are inelegant at best.</p>\n<p>The primary difficulty lies in determining\
    \ page numbers. When working from a scanned book, essentially a facsimile of the\
    \ print edition, finding a page number is not a problem, since pages are of a\
    \ uniform size across devices and display modes. But flowing text file formats\
    \ such as .mobi and .epub do not generally display standardized page numbers.\
    \ Instead, page numbers differ based on font, screen size, text size, and myriad\
    \ other factors. The result is that every user sees different page numbers, and\
    \ these numbers are therefore useless in citation.</p>\n<p><a href=\"https://style.mla.org/\"\
    >MLA recommends</a> that writers use other markers, such as chapter heading, instead\
    \ of the page number in parenthetical citations and bibliographies. Besides its\
    \ imprecision, this solution also lacks a certain aesthetic appeal. It&#8217;s\
    \ a stop-gap fix, and the lack of a proper method of e-book citation leads most\
    \ academics in the humanities to prefer print books to e-books when conducting\
    \ serious research.</p>\n<p>Yet there is some hope for those who wish to continue\
    \ using e-books for writing and research. Here are two workarounds for quoting\
    \ digital editions:</p>\n<p><b>Google Books Wordaround</b></p>"
