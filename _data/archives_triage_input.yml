  source_excerpt: 'Some different internet eras that I''ve lived through:


    - Early 2000s, [Newgrounds](https://www.newgrounds.com/) and weird Flash stuff.
    This was a surprisingly rich culture and the artifacts are mostly lost in the
    [great unflashening](https://en.wikipedia.org/wiki/Thoughts_on_Flash). My friends
    and I had an old school forum on some hidden site we would talk in. Many things
    were broken but there was a lot of energy.

    - Mid-2000s. This is where you have some of the modern platforms pop up. Early
    Facebook was dumb but at least not obnoxious, you learned that all your friends
    liked Napoleon Dynamite and Fight Club. Early Twitter. Bittorrent became a big
    thing. YouTube had everything on it since they didn''t take anything down.

    - Early 2010s. Cypherpunk, seemed like fighting the man online was a thing for
    like six months. Only a few people have phones, blogs are still a thing and coexist
    with Twitter. '
