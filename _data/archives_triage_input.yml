    line: 14
  - file: _data/archives.yml
    line: 1965
  source_excerpt: 'Zotero is an excellent citation manager, but it can be so much
    more. These underused features allow Zotero users to go beyond simply creating
    bibliographies, transforming Zotero into a platform for reading, visualizing,
    and storing academic work.


    Most Zotero users know that the citation manager can <a href="https://www.zotero.org/support/adding_items_to_zotero">store
    local copies of journal articles</a> accessed on repositories such as JSTOR and
    Project MUSE. However, Zotero can also be used to store and retrieve ebooks that
    have been saved to your hard drive. In Zotero Standalone, simply right click an
    entry for a book and select Add Attachment &gt; Attach Stored Copy of File. Navigate
    to the location where your ebook is saved and double-click to make the book a
    permanent part of your Zotero library. The ebook will be stored in a separate
    folder that is backed up along with your Zotero library, so with this feature
    you can create an ebook collection that moves with you from computer to computer.
    For an even stronger collection, use an ebook manager such as <a href="https://calibre-ebook.com/">Calibre</a>
    to convert your ebook to your desired format before storing it in Zotero.


    This feature is also a great way to keep track of your own work. Simply create
    an entry for your paper or publication, and attach a .docx or .pdf of your writing.
    Whenever you <a href="https://www.zotero.org/support/zotero_data">back up your
    Zotero library</a>, your past work will also be saved.'
