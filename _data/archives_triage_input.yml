    line: 875
  source_excerpt: 'Dr. Patrick Smyth is a Principal Developer Relations Engineer at
    [Chainguard](https://www.chainguard.dev/), where he works on AI and software supply
    chain security. He has presented on ML pipeline and software supply chain security
    at RSAC, PyCon, and PyTorch and received Best Speaker for a talk on ML security
    at SwampUP 2024.


    In a former life, Patrick ran data science bootcamps for researchers at Columbia
    University and later founded Iota, a consultancy focused on accessible technical
    training and infrastructure. Through Iota, he worked with organizations including
    [Space Telescope Science Institute](https://www.stsci.edu/), [Pandas](https://numfocus.org/project/pandas),
    and [Sigstore](https://www.sigstore.dev/).


    Patrick''s PhD dissertation, [Negotiated Access: Haccessibility, Autonomy, and
    Infrastructure in the Age of the Abstraction](https://academicworks.cuny.edu/gc_etds/4311/),
    explores hacking as a way to express autonomy, particularly for the disabled.
    It received the Alumni and Doctoral Faculty Prize for the Most Distinguished Dissertation
    of the Year from the PhD program in English at the Graduate Center, CUNY, as well
    as the prize for Best Prospectus.'
