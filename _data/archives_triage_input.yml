    line: 85
  - file: _data/archives.yml
    line: 1289
  source_excerpt: "Buffers are cool because they break with the idea that everything\
    \ the computer does has to be currently visible to the user. If you're using,\
    \ say, iTunes, then there's usually a representation of that program on the screen,\
    \ even if it's minimized. In Emacs, files and processes can still be open and\
    \ easily accessible while staying entirely out of your way. \n\nThere are a few\
    \ other advantages as well. If you're working on a large text file, you can have\
    \ buffers open to different segments of that file, and with [narrowing](https://www.gnu.org/software/emacs/manual/html_node/emacs/Narrowing.html)\
    \ you can even treat segments of the same file as if they were completely different\
    \ files in their own right. The consistent buffer interface means that any command\
    \ that works on one buffer is likely to work on others, which makes buffers easy\
    \ to manipulate and script.\n\nThat's the weird and wonderful world of Emacs buffers,\
    \ windows, and frames for you. Drop me a line if you find any of these explanations\
    \ unclear."
